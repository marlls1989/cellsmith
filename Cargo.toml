[package]
name = "cellsmith"
version = "0.1.0"
edition = "2021"
description = "Generate Cadence Liberate transition arcs (with prevectors) for logic cells, including state-holding/hysteretic cells"
license = "MIT"
repository = "https://github.com/marlls1989/cellsmith"
readme = "README.md"

[dependencies]
espresso-logic = "5.5"
liberty-parse = { package = "liberty-parser", version = "0.2" }
serde = { version = "1", features = ["derive"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
rayon = "1"

[lib]
name = "cellsmith"
path = "src/lib.rs"

[[bin]]
name = "cellsmith"
path = "src/main.rs"
