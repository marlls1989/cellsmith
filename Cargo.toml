[package]
name = "cellsmith"
version = "0.2.0"
edition = "2021"
authors = ["Marcos Sartori <code@msartori.uk>"]
description = "Generate Cadence Liberate transition arcs (with prevectors) for logic cells, including state-holding/hysteretic cells"
license = "MIT"
repository = "https://github.com/marlls1989/cellsmith"
readme = "README.md"
keywords = ["eda", "liberty", "cadence", "asic", "timing"]
categories = ["command-line-utilities"]

[dependencies]
espresso-logic = "5.6.2"
liberty-parse = { package = "liberty-parser", version = "0.3" }
serde = { version = "1", features = ["derive"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }
rayon = "1"

[lib]
name = "cellsmith"
path = "src/lib.rs"
bench = false

[[bin]]
name = "cellsmith"
path = "src/main.rs"
bench = false

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "stages"
harness = false

[[bench]]
name = "aggregate"
harness = false
