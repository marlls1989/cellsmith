[package]
name = "lobsterate"
version = "0.1.0"
edition = "2021"
description = "Generate Cadence Liberate transition arcs (with prevectors) for logic cells, including state-holding/hysteretic cells"
license = "MIT"

[dependencies]
espresso-logic = "5"
liberty-parse = { path = "../pseudosync/liberty-parse" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }

[lib]
name = "lobsterate"
path = "src/lib.rs"

[[bin]]
name = "lobsterate"
path = "src/main.rs"
