[package]
name = "lobsterate"
version = "0.1.0"
edition = "2021"
description = "Generate Cadence Liberate transition arcs (with prevectors) for logic cells, including state-holding/hysteretic cells"
license = "MIT"

[dependencies]
espresso-logic = "5.4"
liberty-parse = { git = "https://github.com/marlls1989/liberty-parse.git", rev = "8e2e3532cdde5a1fa592e0b033b6d748b92d40b3" }
serde = { version = "1", features = ["derive"] }
toml = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "2"
indexmap = { version = "2", features = ["serde"] }

[lib]
name = "lobsterate"
path = "src/lib.rs"

[[bin]]
name = "lobsterate"
path = "src/main.rs"
