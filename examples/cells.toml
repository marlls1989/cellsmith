# Example cellsmith input — the cells cited in the README.
#
#   cellsmith examples/cells.toml -o out      # -> out/cells_arcs.tcl, out/cells.v, out/cells.lib, out/cells_cells.tcl
#   cellsmith examples/cells.toml --stdout    # preview everything on stdout

[[cell]]
name = "AND2"
inputs = ["A", "B"]
[cell.outputs]
Y = "A*B"

[[cell]]
name = ["INVX1", "INVX2", "INVX3"]   # multi-drive inverter: demonstrates -delay/-power/-constraint
inputs = ["A"]                          #   emission and a per-drive template override (INVX2 splits off)
[cell.outputs]
Y = "!A"
[cell.template]
delay = "inv_delay"
power = "inv_power"
constraint = "inv_constraint"
[cell.template_overrides.INVX2]
delay = "inv_delay_x2"

[[cell]]
name = "C2"                    # physical cell name used in the arcs
inputs = ["A", "B"]            # ordered: defines pinlist/vector order
[cell.outputs]
Q = "A*B + Q*(A+B)"            # Q on the RHS => feedback/delayed Q (a 2-input C-element)

[[cell]]
name = "RCELEM2"
inputs = ["A", "B", "R"]
[cell.outputs]                 #   -> their arcs are emitted as `-type async`
Q = "(A*B + Q*(A+B))*!R"

[[cell]]
name = "RACELEM21"
inputs = ["M1", "M2", "P1", "P2", "C", "R"]
[cell.outputs]                 #   -> their arcs are emitted as `-type async`
Q = "(P1*P2*C+Q*(M1+M2+C))*!R"

[[cell]]
name = "SR"
inputs = ["S", "R"]
[cell.outputs]
Q  = "!(R+Qn)"                # cross-coupling: Q and Qn reference each other
Qn = "!(S+Q)"

[[cell]]
name = "MUT"
inputs = ["A", "B"]            # mutex/arbiter: grants are mutually exclusive, oscillates at A*B
[cell.outputs]                 #   -> arcs condition each grant on the other. The oscillation is
                               #   detected and reported on stderr; constraint blocks are generated
                               #   only when constraint_arcs is true, which this cell does not request
Qa  = "!Qb * A"
Qb  = "!Qa * B"

[[cell]]
name = "DFF"
inputs = ["CLK", "D"]
clock = ["CLK"]                # CLK is a clock: setup/hold of D is characterised w.r.t. it, and the
                               #   concomitant non_seq hazard on (CLK, D) is subsumed by the setup/hold
constraint_arcs = true         # opt in: emit the derived setup/hold constraint arcs of D w.r.t. CLK
[cell.internal]                # internal master latch: a state node with no external pin
M = "!CLK*D + CLK*M"           #   transparent when CLK low, holds when high
[cell.outputs]
Q = "CLK*M + !CLK*Q"           # slave: captures M on the rising edge (M established by the prevector)

[[cell]]
name = "DLH"
inputs = ["G", "D"]
clock = ["G"]                  # active-high enable, marked as the timing reference
[cell.outputs]
Q = "G*D + !G*Q"               # transparent-high D latch: Q follows D while G high, holds while G low.
                               #   A lone latch is not a master-slave pair, so it stays level — no edge
                               #   collapse even though its enable is a declared clock.

[[cell]]
name = "ICM"
inputs = ["CLKA", "CLKB", "RA", "RB", "S"]
clock = ["CLKA", "CLKB"]
expose = ["sela1", "sela2", "enA", "selb1", "selb2", "enB"]
                               # the three latch levels of both synchronisers. Each holds its own value,
                               #   so each is a coordinate the reduction keeps either way; exposing them
                               #   names them in the arcs, where a column and an -ic entry state which
                               #   stage of a chain a measurement starts from.

[cell.internal]
# selection interlock
sela = "!enB*!S"
selb = "!enA*S"
# CLKA synchroniser
sela1 = "!RA*(!CLKA*sela+CLKA*sela1)"
sela2 = "!RA*(CLKA*sela1+!CLKA*sela2)"
enA   = "!RA*(!CLKA*sela2+CLKA*enA)"
# CLKB synchroniser
selb1 = "!RB*(!CLKB*selb+CLKB*selb1)"
selb2 = "!RB*(CLKB*selb1+!CLKB*selb2)"
enB   = "!RB*(!CLKB*selb2+CLKB*enB)"
[cell.outputs]
GCLK = "enA*CLKA+enB*CLKB"

[[cell]]
name = "C2GATE"               # gate-level C-element: two reducible internals, one of them exposed
inputs = ["A", "B"]
expose = ["QN"]                # IQ carries the same function as the output pin Q, so it retires into it
                               #   before anything else runs. QN is held back from that reduction while
                               #   the arcs are derived: it takes a -pinlist column of its own, the arcs
                               #   state the voltage it starts at (-ic) and the edge it makes, and the
                               #   Liberty, Verilog and cells.tcl artifacts are those of the cell
                               #   reduced the whole way, where the single coordinate Q carries the bit.
[cell.internal]
IQ = "!QN"
QN = "!(A*B + IQ*(A+B))"
[cell.outputs]
Q = "!QN"                      # reduced the whole way this is one coordinate, delta_Q = A*B + Q*(A+B)

